services:
  web:
    build: .
    image: ${WE_EAT_IMAGE:-we-eat:local}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    volumes:
      - meals:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  meals:
